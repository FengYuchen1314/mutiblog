name: Publish container

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: bash -n deploy/*.sh && bash deploy/update-test.sh
      - run: go test ./...
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: go build ./cmd/mutiblog
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build amd64 smoke-test image without publishing
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          platforms: linux/amd64
          build-args: VERSION=${{ github.sha }}
          tags: mutiblog:smoke-amd64
          cache-from: type=gha,scope=smoke-amd64
          cache-to: type=gha,mode=max,scope=smoke-amd64
      - name: Smoke-test amd64 candidate image
        run: ./deploy/smoke-test.sh mutiblog:smoke-amd64
      - name: Build arm64 smoke-test image without publishing
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          platforms: linux/arm64
          build-args: VERSION=${{ github.sha }}
          tags: mutiblog:smoke-arm64
          cache-from: type=gha,scope=smoke-arm64
          cache-to: type=gha,mode=max,scope=smoke-arm64
      - name: Smoke-test arm64 candidate image through QEMU
        run: ./deploy/smoke-test.sh mutiblog:smoke-arm64
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/fengyuchen1314/mutiblog
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha
            type=raw,value=ci-${{ github.sha }}
      - id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=gha,scope=smoke-amd64
            type=gha,scope=smoke-arm64
          cache-to: type=gha,mode=max,scope=release
          provenance: mode=max
          sbom: true
      - name: Attest published image provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/fengyuchen1314/mutiblog
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
