# Optional reverse proxy. Mount the generated/ *parent* directory at /app/generated
# (not generated/public): public is atomically switched to a new release symlink.
# Leave open_file_cache disabled so Nginx observes each release switch.
server {
  listen 80;
  server_name _;
  root /app/generated/public;
  index index.html;

  # Locale negotiation is the only public request that needs the Go process.
  location = / {
    proxy_pass http://blog:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location /admin/ {
    proxy_pass http://blog:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location /api/ {
    proxy_pass http://blog:8080;
    proxy_read_timeout 90s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location = /healthz { proxy_pass http://blog:8080; }

  location /media/ {
    alias /app/media/;
    add_header X-Content-Type-Options nosniff always;
    expires 30d;
  }
  location /assets/ {
    try_files $uri =404;
    expires 365d;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  # Keep the original 404 status while serving the generated locale-specific page.
  location ~ ^/(?<locale>[A-Za-z0-9-]+)(?:/|$) {
    error_page 404 /$locale/404.html;
    try_files $uri $uri/index.html =404;
    expires 5m;
    add_header Cache-Control "public, max-age=300, must-revalidate" always;
  }
  location / {
    error_page 404 /zh-cn/404.html;
    try_files $uri $uri/index.html =404;
    expires 5m;
    add_header Cache-Control "public, max-age=300, must-revalidate" always;
  }
}
