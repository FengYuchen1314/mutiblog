name: mutiblog

services:
  app:
    image: ${MUTIBLOG_IMAGE:-ghcr.io/fengyuchen1314/mutiblog:latest}
    container_name: mutiblog-app
    restart: unless-stopped
    environment:
      MUTIBLOG_ADDRESS: ":8080"
      MUTIBLOG_DATA_DIR: /var/lib/mutiblog
      MUTIBLOG_CONSOLE_DIR: /app/console
      MUTIBLOG_RENDERER_CLI: /app/renderer/cli.mjs
    volumes:
      - mutiblog-data:/var/lib/mutiblog
    networks:
      - mutiblog

  caddy:
    image: caddy:2.10-alpine
    container_name: mutiblog-caddy
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - mutiblog-data:/srv/mutiblog:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - mutiblog

networks:
  mutiblog:
    name: mutiblog

volumes:
  mutiblog-data:
    name: mutiblog-data
  caddy-data:
    name: mutiblog-caddy-data
  caddy-config:
    name: mutiblog-caddy-config
